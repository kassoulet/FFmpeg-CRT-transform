[package]
name = "ffcrt"
version = "0.1.0"
edition = "2021"
description = "Native-Rust CRT/flat-panel monitor simulation (port of the FFmpeg-CRT-transform script)"

[[bin]]
name = "ffcrt"
path = "src/main.rs"

[dependencies]
image = "0.25"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[profile.release]
opt-level = 3
