[package]
name = "crt-transform"
version = "0.2.0"
edition = "2021"
description = "Native-Rust CRT / flat-panel monitor simulation — fast, configurable, no FFmpeg required"
license = "MIT OR Apache-2.0"
authors = ["VileR", "opencode contributors"]
repository = "https://github.com/kassoulet/FFmpeg-CRT-transform"
keywords = ["crt", "monitor", "simulation", "image-processing", "retro"]
categories = ["multimedia::images", "graphics"]

[[bin]]
name = "crt-transform"
path = "src/main.rs"

[lib]
name = "crt_transform"
path = "src/lib.rs"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[features]
bench = []
profile-with-puffin = ["profiling/profile-with-puffin"]

[dependencies]
image = "0.25"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
rayon = "1"
profiling = "1.0"

[[bench]]
name = "ops"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = true
