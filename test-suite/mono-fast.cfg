; Fast companion to 06cfg.cfg (paperwhite mono family).
; PRESCALE_BY=2 + OY=480 + HALATION_RADIUS=10 runs in <5 s while exercising
; the same code paths: mono tint, no shadowmask, scanlines, bloom, halation,
; CRT curvature, vignette.
PRESCALE_BY       2
PX_ASPECT         1/1
16BPC_PROCESSING  no
OY                480
OASPECT           4/3
OMARGIN           8
OFILTER           bicubic
OFORMAT           0
MONITOR_COLOR     paperwhite
INVERT_INPUT      no
BRIGHTEN          1.2
BLACKPOINT        0
OVL_TYPE          triad
OVL_SCALE         0.12
OVL_ALPHA         0.6
H_PX_BLUR         12
V_PX_BLUR         12
HALATION_ON       yes
HALATION_RADIUS   10
HALATION_ALPHA    0.04
SCANLINES_ON      yes
SL_ALPHA          0.2
SL_WEIGHT         1
SCAN_FACTOR       single
BLOOM_ON          yes
BLOOM_POWER       1.0
P_DECAY_FACTOR    0
P_DECAY_ALPHA     0.30
LATENCY           0
LATENCY_ALPHA     0
FLAT_PANEL        no
PXGRID_ALPHA      0.6
PX_X_GAP          1
PX_Y_GAP          1
PX_FACTOR_X       1
PX_FACTOR_Y       1
LCD_GRAIN         0
CRT_CURVATURE     0.08
BEZEL_CURVATURE   0.08
CORNER_RADIUS     0
VIGNETTE_ON       yes
VIGNETTE_POWER    0.1
