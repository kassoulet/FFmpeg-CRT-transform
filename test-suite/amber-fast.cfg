; Fast companion to 09cfg.cfg (amber mono family).
; PRESCALE_BY=2 + OY=480 + HALATION_RADIUS=10 runs in <5 s while exercising
; the same code paths: amber tint, non-square PX_ASPECT, scanlines with
; SL_WEIGHT>1 (fat beam), bloom, halation, rounded corner bezel, vignette.
PRESCALE_BY       2
PX_ASPECT         2/3
16BPC_PROCESSING  no
OY                480
OASPECT           4/3
OMARGIN           8
OFILTER           gauss
OFORMAT           0
MONITOR_COLOR     amber
INVERT_INPUT      no
BRIGHTEN          1.0
BLACKPOINT        40
OVL_TYPE          triad
OVL_SCALE         0.12
OVL_ALPHA         0.6
H_PX_BLUR         42
V_PX_BLUR         12
HALATION_ON       yes
HALATION_RADIUS   10
HALATION_ALPHA    0.018
SCANLINES_ON      yes
SL_ALPHA          0.3
SL_WEIGHT         1.4
SCAN_FACTOR       single
BLOOM_ON          yes
BLOOM_POWER       0.75
P_DECAY_FACTOR    0.5
P_DECAY_ALPHA     0.38
LATENCY           0
LATENCY_ALPHA     0
FLAT_PANEL        no
PXGRID_ALPHA      0.6
PX_X_GAP          1
PX_Y_GAP          1
PX_FACTOR_X       1
PX_FACTOR_Y       1
LCD_GRAIN         0
CRT_CURVATURE     0.03
BEZEL_CURVATURE   0.06
CORNER_RADIUS     100
VIGNETTE_ON       yes
VIGNETTE_POWER    0.115
