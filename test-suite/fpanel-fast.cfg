; Fast integration-test config for the flat-panel (lcd) family.
; FLAT_PANEL=yes exercises the pixel-grid path; PRESCALE_BY=1 + OY=240 keeps
; runtime under 3 s on a typical workstation.
PRESCALE_BY       1
PX_ASPECT         1/1
16BPC_PROCESSING  no
OY                240
OASPECT           4/3
OMARGIN           4
OFILTER           bicubic
OFORMAT           0
MONITOR_COLOR     lcd
INVERT_INPUT      no
BRIGHTEN          1.0
BLACKPOINT        0
OVL_TYPE          triad
OVL_SCALE         0.11
OVL_ALPHA         0.0
H_PX_BLUR         10
V_PX_BLUR         10
HALATION_ON       no
HALATION_RADIUS   10
HALATION_ALPHA    0.05
SCANLINES_ON      no
SL_ALPHA          0.5
SL_WEIGHT         1
SCAN_FACTOR       single
BLOOM_ON          no
BLOOM_POWER       0.5
P_DECAY_FACTOR    0
P_DECAY_ALPHA     0.4
LATENCY           0
LATENCY_ALPHA     0
FLAT_PANEL        yes
PXGRID_ALPHA      0.5
PX_X_GAP          1
PX_Y_GAP          1
PX_FACTOR_X       1
PX_FACTOR_Y       1
LCD_GRAIN         20
CRT_CURVATURE     0.0
BEZEL_CURVATURE   0.0
CORNER_RADIUS     0
VIGNETTE_ON       yes
VIGNETTE_POWER    0.1
