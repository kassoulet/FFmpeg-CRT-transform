name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install ffmpeg
        run: |
          curl -fsSLo /tmp/ffmpeg.tar.xz \
            https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          mkdir -p /tmp/ffbin
          tar xJf /tmp/ffmpeg.tar.xz \
            --strip=2 -C /tmp/ffbin \
            ffmpeg-master-latest-linux64-gpl/bin/ffmpeg \
            ffmpeg-master-latest-linux64-gpl/bin/ffprobe
          rm /tmp/ffmpeg.tar.xz
          echo "/tmp/ffbin" >> "$GITHUB_PATH"
          /tmp/ffbin/ffmpeg -version
          /tmp/ffbin/ffprobe -version

      - name: Build
        run: cargo build --release

      - name: Test
        run: cargo test

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Format
        run: cargo fmt --check
