name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rust/toolchain@v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Install ffmpeg
        run: |
          mkdir -p /tmp/ffbin
          curl -fsSL https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz |
            tar xJ --wildcards 'ffmpeg-*-amd64-static/ffmpeg' --strip=1 -C /tmp/ffbin
          chmod +x /tmp/ffbin/ffmpeg
          echo "/tmp/ffbin" >> "$GITHUB_PATH"
          /tmp/ffbin/ffmpeg -version

      - name: Build
        run: cargo build --release

      - name: Test
        run: cargo test

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Format
        run: cargo fmt --check
