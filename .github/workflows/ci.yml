name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install ffmpeg
        run: |
          curl -fsSLo /tmp/ffmpeg.tar.xz \
            https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
          mkdir -p /tmp/ffbin
          tar xJf /tmp/ffmpeg.tar.xz \
            --wildcards --strip=1 -C /tmp/ffbin 'ffmpeg-*-amd64-static/ffmpeg'
          rm /tmp/ffmpeg.tar.xz
          echo "/tmp/ffbin" >> "$GITHUB_PATH"
          /tmp/ffbin/ffmpeg -version

      - name: Build
        run: cargo build --release

      - name: Test
        run: cargo test

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Format
        run: cargo fmt --check
