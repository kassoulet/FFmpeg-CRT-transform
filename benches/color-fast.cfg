; Benchmark fixture for bench_full_pipeline.
; PRESCALE_BY=2 + OY=480 keeps each iteration under 2 s while still exercising
; every major branch: shadowmask, scanlines, bloom, halation, curvature, vignette.
PRESCALE_BY       2
PX_ASPECT         1/1
16BPC_PROCESSING  no
OY                480
OASPECT           4/3
OMARGIN           4
OFILTER           bicubic
OFORMAT           0
MONITOR_COLOR     rgb
INVERT_INPUT      no
BRIGHTEN          2.0
BLACKPOINT        0
OVL_TYPE          triad
OVL_SCALE         0.11
OVL_ALPHA         0.6
H_PX_BLUR         40
V_PX_BLUR         0
HALATION_ON       yes
HALATION_RADIUS   20
HALATION_ALPHA    0.08
SCANLINES_ON      yes
SL_ALPHA          0.6
SL_WEIGHT         0.5
SCAN_FACTOR       single
BLOOM_ON          yes
BLOOM_POWER       0.4
P_DECAY_FACTOR    0
P_DECAY_ALPHA     0.3
LATENCY           0
LATENCY_ALPHA     0
FLAT_PANEL        no
PXGRID_ALPHA      0.5
PX_X_GAP          1
PX_Y_GAP          1
PX_FACTOR_X       1
PX_FACTOR_Y       1
LCD_GRAIN         0
CRT_CURVATURE     0.06
BEZEL_CURVATURE   0.09
CORNER_RADIUS     0
VIGNETTE_ON       yes
VIGNETTE_POWER    0.1
