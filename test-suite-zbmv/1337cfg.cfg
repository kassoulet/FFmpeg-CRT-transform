; C64 PAL demo capture — 384x272 (full frame with border), ~50 fps
; Simulates a consumer PAL television set

PRESCALE_BY       6
PX_ASPECT         1/1
16BPC_PROCESSING  no

OY                1080
OASPECT           4/3
OMARGIN           8
OFILTER           gauss
OFORMAT           0

MONITOR_COLOR     rgb
INVERT_INPUT      no
BRIGHTEN          2.7
BLACKPOINT        0

OVL_TYPE          slot
OVL_SCALE         0.1
OVL_ALPHA         0.65

H_PX_BLUR         55
V_PX_BLUR         0

HALATION_ON       yes
HALATION_RADIUS   20
HALATION_ALPHA    0.08

SCANLINES_ON      yes
SL_ALPHA          0.7
SL_WEIGHT         0.5
SCAN_FACTOR       single

BLOOM_ON          yes
BLOOM_POWER       0.4

MAX_DURATION     60

P_DECAY_FACTOR    0.75
P_DECAY_ALPHA     0.3
LATENCY           0
LATENCY_ALPHA     0

FLAT_PANEL        no
PXGRID_ALPHA      0.6
PX_X_GAP          1
PX_Y_GAP          1
PX_FACTOR_X       1
PX_FACTOR_Y       1
LCD_GRAIN         0

CRT_CURVATURE     0.06
BEZEL_CURVATURE   0.09
CORNER_RADIUS     50
VIGNETTE_ON       yes
VIGNETTE_POWER    0.1
